name: Construir y publicar imágenes

on:
  push:
    branches: [main]

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: felipe4563

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push — ${{ matrix.servicio }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/agrov1-${{ matrix.servicio }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/agrov1-${{ matrix.servicio }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
