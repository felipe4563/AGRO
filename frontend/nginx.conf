server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Este contenedor solo recibe tráfico plano por el puerto 80 (el proxy
    # del VPS/Cloudflare es quien termina HTTPS); sin esto, los redirects
    # automáticos de nginx (ej. pedir "/tutoriales" sin la barra final, que
    # matchea un location terminado en "/") arman la URL absoluta con
    # $scheme = http y el navegador los bloquea por contenido mixto. Con esto
    # apagado, nginx redirige con un Location relativo (sin esquema ni host).
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API — proxy interno hacia el contenedor backend (mismo origen para el navegador,
    # así que no hace falta configurar CORS en producción).
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes subidas (productos, combos, logo de la empresa)
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
    }

    # Videos tutoriales del sistema. Cache-Control explícito para que
    # Cloudflare (u otro proxy intermedio) sepa cachear estos archivos por su
    # cuenta en vez de aplicar su propia heurística por defecto a la ruta.
    location /tutoriales/ {
        proxy_pass http://backend:3000/tutoriales/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Service worker de la PWA: nunca debe quedar cacheado por el navegador/proxy,
    # si no los usuarios pueden quedarse atados a una versión vieja de la app.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA — todas las rutas de React Router caen a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
